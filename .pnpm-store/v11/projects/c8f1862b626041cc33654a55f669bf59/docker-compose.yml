services:
  db:
    image: postgres:16
    container_name: cedest_lab_db
    environment:
      POSTGRES_USER: cedest
      POSTGRES_PASSWORD: cedest
      POSTGRES_DB: cedest_lab
    ports:
      - "5432:5432"
    volumes:
      - cedest_lab_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cedest -d cedest_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cedest_lab_data:
